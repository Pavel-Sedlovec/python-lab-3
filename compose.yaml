services:
  api:
    build: ./api
    container_name: sleep-tracker-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 5438
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - "8000:8000"
    restart: unless-stopped
