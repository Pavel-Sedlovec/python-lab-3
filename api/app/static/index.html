<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleep Tracker</title>
<style>
:root{font-family:Arial,sans-serif;color:#202938;background:#f4f6fb}body{max-width:1100px;margin:32px auto;padding:0 16px}h1{margin-bottom:6px}.muted{color:#687386}.panel{background:white;border:1px solid #e0e5ef;border-radius:12px;padding:18px;margin:18px 0;box-shadow:0 3px 12px #15213b0a}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{display:flex;flex-direction:column;gap:6px;font-size:14px}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #cbd3e1;border-radius:7px}textarea{resize:vertical;min-height:40px}button{cursor:pointer;background:#2459c4;color:white;border:0}button.secondary{background:#e9edf5;color:#253047}button.danger{background:#b83333}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;border-bottom:1px solid #e4e8f0;padding:10px 8px}th{background:#f7f8fb}tbody tr{cursor:pointer}tbody tr:hover,tbody tr.selected{background:#eaf1ff}.table-wrap{overflow-x:auto}.message{padding:10px;border-radius:7px;margin-top:12px;display:none}.ok{display:block;background:#e4f7e9;color:#17652b}.err{display:block;background:#ffebeb;color:#922}.stats{font-weight:bold}@media(max-width:600px){body{margin:18px auto}.panel{padding:12px}}
</style></head>
<body>
<h1>🌙 Sleep Tracker</h1><div class="muted">Учёт и анализ сна в браузере</div>
<section class="panel"><h2>Запись сна</h2><form id="record-form">
<div class="form"><label>Заснул<input id="sleep_start" type="datetime-local" required></label><label>Проснулся<input id="sleep_end" type="datetime-local" required></label><label>Качество сна (1–5)<select id="quality"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label><label>Заметка<textarea id="notes" maxlength="2000" placeholder="Например: хорошо выспался"></textarea></label></div>
<div class="actions"><button type="submit" id="save-btn">Добавить запись</button><button type="button" class="secondary" id="clear-btn">Очистить форму</button><button type="button" class="danger" id="delete-btn" disabled>Удалить выбранную</button></div></form><div id="message" class="message"></div></section>
<section class="panel"><h2>История сна</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Заснул</th><th>Проснулся</th><th>Длительность</th><th>Качество</th><th>Заметка</th></tr></thead><tbody id="records"><tr><td colspan="6">Загрузка…</td></tr></tbody></table></div></section>
<section class="panel"><h2>Статистика</h2><div id="stats" class="stats">Загрузка…</div></section>
<script>
const $=id=>document.getElementById(id);let selectedId=null;let records=[];
function showMessage(text,ok=false){const el=$('message');el.textContent=text;el.className='message '+(ok?'ok':'err');}
function hideMessage(){ $('message').className='message'; }
function toInput(value){return value?value.slice(0,16):''}
function resetForm(){selectedId=null;$('record-form').reset();$('quality').value='3';$('save-btn').textContent='Добавить запись';$('delete-btn').disabled=true;document.querySelectorAll('#records tr').forEach(r=>r.classList.remove('selected'));hideMessage();}
function payload(){const start=$('sleep_start').value,end=$('sleep_end').value;if(!start||!end)throw Error('Укажи время засыпания и пробуждения.');if(new Date(end)<=new Date(start))throw Error('Время пробуждения должно быть позже времени засыпания.');return {sleep_start:new Date(start).toISOString(),sleep_end:new Date(end).toISOString(),quality:Number($('quality').value),notes:$('notes').value.trim()||null};}
async function request(url,options={}){const response=await fetch(url,{headers:{'Content-Type':'application/json'},...options});if(!response.ok){let msg='Ошибка запроса';try{msg=(await response.json()).detail||msg}catch{}throw Error(Array.isArray(msg)?msg.map(x=>x.msg).join('; '):msg)}return response.status===204?null:response.json();}
async function load(){try{records=await request('/sleep');const body=$('records');body.replaceChildren();if(!records.length){body.innerHTML='<tr><td colspan="6">Пока нет записей. Добавь первую выше.</td></tr>';}for(const r of records){const start=new Date(r.sleep_start),end=new Date(r.sleep_end),tr=document.createElement('tr');tr.dataset.id=r.id;const values=[r.id,start.toLocaleString('ru-RU'),end.toLocaleString('ru-RU'),((end-start)/3600000).toFixed(2)+' ч',r.quality,r.notes||''];values.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tr.onclick=()=>selectRecord(r.id);body.appendChild(tr);}const stats=await request('/stats');$('stats').textContent=`Всего записей: ${stats.records_count} · Средняя длительность: ${stats.average_duration_hours==null?'нет данных':stats.average_duration_hours.toFixed(2)+' ч'}`;}catch(e){showMessage('Не удалось загрузить данные: '+e.message);$('stats').textContent='Нет данных';}}
function selectRecord(id){const r=records.find(x=>x.id===id);if(!r)return;selectedId=id;$('sleep_start').value=toInput(r.sleep_start);$('sleep_end').value=toInput(r.sleep_end);$('quality').value=String(r.quality);$('notes').value=r.notes||'';$('save-btn').textContent='Сохранить изменения';$('delete-btn').disabled=false;document.querySelectorAll('#records tr').forEach(tr=>tr.classList.toggle('selected',Number(tr.dataset.id)===id));hideMessage();}
$('record-form').addEventListener('submit',async e=>{e.preventDefault();try{const data=payload();if(selectedId!==null){await request('/sleep/'+selectedId,{method:'PUT',body:JSON.stringify(data)});showMessage('Изменения сохранены.',true);}else{await request('/sleep',{method:'POST',body:JSON.stringify(data)});showMessage('Запись добавлена.',true);}resetForm();await load();}catch(err){showMessage(err.message);}});
$('clear-btn').onclick=resetForm;
$('delete-btn').onclick=async()=>{if(selectedId===null)return;if(!confirm('Удалить выбранную запись?'))return;try{await request('/sleep/'+selectedId,{method:'DELETE'});resetForm();await load();showMessage('Запись удалена.',true);}catch(e){showMessage(e.message);}};
load();
</script></body></html>
